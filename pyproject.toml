[project]
name = "homelab"
version = "0.1.0"
requires-python = ">= 3.12"
dependencies = []

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
homelab = { path = ".", editable = true }
kanana-banana = { path = "packages/kanana-banana", editable = true }
dev-spaces = { path = "packages/dev-spaces", editable = true }

[tool.pixi.tasks]

[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=8"
httpx2 = "*"

[tool.pixi.feature.test.tasks]
test-dev-spaces = "pytest packages/dev-spaces/tests"
test-kanana-banana = "pytest packages/kanana-banana/tests"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
