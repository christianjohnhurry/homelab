[project]
name = "dev-spaces"
version = "0.0.0"
description = "Sandboxed Docker containers per ticket: clone, checkout, install, work, destroy."
requires-python = ">= 3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
dev-spaces = "dev_spaces.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/dev_spaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not docker'"
markers = [
    "docker: needs Docker Desktop, network and a real GH_TOKEN (opt in with -m docker)",
]
