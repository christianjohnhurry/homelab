{# Create/Edit ticket form #}

<div class="form-container">
    <h2>{% if ticket %}Edit Ticket{% else %}New Ticket{% endif %}</h2>

    <form
        hx-post="{% if ticket %}/tickets/{{ ticket.id }}/edit{% else %}/boards/{{ current_board_id }}/tickets{% endif %}"
        hx-target="body"
        hx-swap="none"
        hx-on::after-request="if(event.detail.successful) { location.reload(); }">

        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ ticket.name if ticket else '' }}"
                required
                maxlength="200">
        </div>

        <div class="form-group">
            <label for="ticket_type">Type</label>
            <select id="ticket_type" name="ticket_type" {% if ticket %}disabled{% endif %}>
                {% for t in ticket_types %}
                <option
                    value="{{ t.value }}"
                    {% if ticket and ticket.ticket_type == t %}selected{% endif %}>
                    {{ t.value | title }}
                </option>
                {% endfor %}
            </select>
            {% if ticket %}
            <small>Type cannot be changed after creation.</small>
            {% endif %}
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                {% for s in statuses %}
                <option
                    value="{{ s.value }}"
                    {% if ticket and ticket.status == s %}selected{% endif %}
                    {% if not ticket and s.value == 'to-do' %}selected{% endif %}>
                    {{ s.value | replace("-", " ") | title }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="parent_id">Parent</label>
            <select id="parent_id" name="parent_id">
                <option value="">None (for projects)</option>
                {% for p in possible_parents %}
                <option
                    value="{{ p.id }}"
                    {% if ticket and ticket.parent_id == p.id %}selected{% endif %}>
                    [{{ p.ticket_type.value | upper }}] {{ p.name }}
                </option>
                {% endfor %}
            </select>
            <small>Projects have no parent. Tasks need a project parent. Subtasks need a task parent.</small>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="4">{{ ticket.description if ticket else '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if ticket %}Update{% else %}Create{% endif %}
            </button>
            <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        </div>
    </form>
</div>
