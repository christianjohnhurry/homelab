{# Create/Edit board form - displayed in a modal #}

<div class="form-container">
    <h2>{% if board %}Edit Board{% else %}New Board{% endif %}</h2>

    <form
        hx-post="{% if board %}/boards/{{ board.id }}/edit{% else %}/boards{% endif %}"
        hx-target="body"
        hx-swap="none"
        hx-on::after-request="if(event.detail.successful) { location.reload(); }">

        <div class="form-group">
            <label for="name">Board Name</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ board.name if board else '' }}"
                required
                maxlength="200"
                placeholder="e.g., My Awesome Project">
        </div>

        <div class="form-group">
            <label for="repo_url">Repository URL (optional)</label>
            <input
                type="url"
                id="repo_url"
                name="repo_url"
                value="{{ board.repo_url if board and board.repo_url else '' }}"
                placeholder="https://github.com/username/repo">
            <small>Link to the repository this board tracks</small>
        </div>

        <div class="form-group">
            <label for="description">Description (optional)</label>
            <textarea
                id="description"
                name="description"
                rows="3"
                placeholder="What is this board for?">{{ board.description if board else '' }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if board %}Update Board{% else %}Create Board{% endif %}
            </button>
            {% if board %}
            <button
                type="button"
                hx-post="/boards/{{ board.id }}/delete"
                hx-target="body"
                hx-swap="none"
                hx-confirm="Delete this board? You must remove all tickets first."
                hx-on::after-request="if(event.detail.successful) { location.href='/'; }"
                class="btn btn-danger">
                Delete Board
            </button>
            {% endif %}
            <button type="button" class="btn" onclick="closeModal()">Cancel</button>
        </div>
    </form>
</div>
