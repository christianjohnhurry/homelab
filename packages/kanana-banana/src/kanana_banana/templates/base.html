<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kanana Banana{% endblock %}</title>

    <!-- HTMX: Enables AJAX requests via HTML attributes -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Kanana Banana</h1>
        <nav>
            <a href="/">Board</a>
            <!-- hx-get: Fetch this URL when clicked -->
            <!-- hx-target: Put the response in this element -->
            <!-- hx-swap: Replace the innerHTML of the target -->
            <button
                hx-get="/tickets/new"
                hx-target="#modal-content"
                hx-swap="innerHTML"
                class="btn btn-primary">
                + New Ticket
            </button>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Modal container for forms and details -->
    <div id="modal" class="modal" style="display: none;">
        <div class="modal-backdrop" onclick="closeModal()"></div>
        <div id="modal-content" class="modal-content"></div>
    </div>

    <script>
        // Simple modal management
        // HTMX triggers 'htmx:afterSwap' when content is loaded
        document.body.addEventListener('htmx:afterSwap', function(event) {
            if (event.detail.target.id === 'modal-content') {
                document.getElementById('modal').style.display = 'flex';
            }
        });

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('modal-content').innerHTML = '';
        }

        // Close modal on successful form submission
        document.body.addEventListener('htmx:afterRequest', function(event) {
            // If the request came from a form in the modal and succeeded
            if (event.detail.successful &&
                event.detail.elt.closest('#modal-content')) {
                closeModal();
            }
        });
    </script>
</body>
</html>
