[project]
name = "kanana-banana"
version = "0.2.0"
requires-python = ">= 3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "pydantic-settings>=2.0",
    "httpx2>=2.13",
    "typer>=0.12",
]

[project.scripts]
kanana-banana = "kanana_banana.app:main"
kb = "kanana_banana.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/kanana_banana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
