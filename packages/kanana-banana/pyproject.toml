[project]
name = "kanana-banana"
version = "0.1.0"
requires-python = ">= 3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "pydantic-settings>=2.0",
]

[project.scripts]
kanana-banana = "kanana_banana.app:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/kanana_banana"]
